services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: livinghope
      POSTGRES_PASSWORD: livinghope
      POSTGRES_DB: livinghope
    ports:
      - "5442:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livinghope"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    init: true
    command: sh -c "npx prisma migrate deploy && exec npm run start"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://livinghope:livinghope@db:5432/livinghope?schema=public"
      NODE_ENV: "production"
      PORT: "3010"
      STORAGE_DRIVER: "local"
    ports:
      - "3010:3010"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3010/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db-data:
  uploads:
