services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: livinghope
      POSTGRES_PASSWORD: livinghope
      POSTGRES_DB: livinghope
    ports:
      - "5442:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livinghope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
